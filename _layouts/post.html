---
layout: default
---

<main>
  <div class="post-content">
    <div style="margin-bottom:1.5rem;">
      {% if page.tema_url %}
      <a href="{{ page.tema_url }}" style="color:#343b1b; text-decoration:underline; font-size:0.85rem; letter-spacing:0.04em;">
        ← Volver a {{ page.tema }}
      </a>
      {% else %}
      <a href="/" style="color:#343b1b; text-decoration:underline; font-size:0.85rem; letter-spacing:0.04em;">
        ← Volver al inicio
      </a>
      {% endif %}
    </div>

    <h1 style="font-size:1.7rem; font-weight:600; color:#343b1b; margin-bottom:0.3rem;">
      {{ page.title }}
    </h1>
    <p style="color:#a8b890; font-size:0.8rem; letter-spacing:0.05em; margin-bottom:2.5rem; text-transform:uppercase;">
      {{ page.tema }}
    </p>

    {{ content }}
  </div>
</main>
