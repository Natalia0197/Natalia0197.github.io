<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Portafolio SO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fbfcee;
      color: #343b1b;
      min-height: 100vh;
    }

    header {
      background: #343b1b;
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 1rem;
      font-weight: 600;
      color: #fbfcee;
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    nav a {
      color: #c8d69b;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    nav a:hover { color: #fbfcee; }

    .hero {
      background: #3971b8;
      padding: 5rem 3rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.2rem;
      color: #fbfcee;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }

    .hero p {
      color: #c8d69b;
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      background: #f6e6a5;
      color: #343b1b;
      padding: 0.25rem 0.9rem;
      border-radius: 20px;
      font-size: 0.78rem;
      margin: 0.2rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    main {
      max-width: 760px;
      margin: 4rem auto;
      padding: 0 2rem;
    }

    .section-title {
      font-size: 0.78rem;
      color: #3971b8;
      margin-bottom: 2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid #c8d69b;
    }

    .post-card {
      background: #ffffff;
      border: 1px solid #c8d69b;
      border-radius: 8px;
      padding: 1.8rem;
      margin-bottom: 1.2rem;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .post-card:hover {
      border-color: #3971b8;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(57,113,184,0.1);
    }

    .post-card h2 {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .post-card h2 a { color: #343b1b; text-decoration: none; }
    .post-card h2 a:hover { color: #3971b8; }

    .post-card .meta {
      color: #3971b8;
      font-size: 0.78rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .post-card p { color: #6b7560; font-size: 0.92rem; line-height: 1.7; }

    .post-content {
      background: #ffffff;
      border: 1px solid #c8d69b;
      border-radius: 8px;
      padding: 3rem;
      line-height: 1.9;
    }

    .post-content h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #343b1b;
      margin-bottom: 0.4rem;
    }

    .post-content h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #3971b8;
      margin: 2rem 0 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #c8d69b;
    }

    .post-content h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #343b1b;
      margin: 1.5rem 0 0.5rem;
    }

    .post-content p {
      color: #4a5240;
      margin-bottom: 1rem;
      font-size: 0.97rem;
    }

    .post-content code {
      background: #f6e6a5;
      color: #343b1b;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .post-content pre {
      background: #343b1b;
      border-radius: 8px;
      border-left: 4px solid #3971b8;
      padding: 1.5rem;
      overflow-x: auto;
      margin: 1.2rem 0;
    }

    .post-content pre code {
      background: none;
      color: #c8d69b;
      font-size: 0.88rem;
      font-weight: 400;
    }

    .post-content img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #c8d69b;
      margin: 1.5rem 0;
    }

    .post-content ul, .post-content ol {
      padding-left: 1.5rem;
      color: #4a5240;
      margin-bottom: 1rem;
      font-size: 0.97rem;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 2.5rem;
      color: #6b7560;
      font-size: 0.8rem;
      border-top: 2px solid #c8d69b;
      margin-top: 5rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Portafolio · Sistemas Operativos</a>
    <nav>
      <a href="/">Inicio</a>
      <a href="/about">Acerca de</a>
    </nav>
  </header>

  {{ content }}

  <footer>
    Natalia — Instituto de Computación, UTM · 2026
  </footer>
</body>
</html>
