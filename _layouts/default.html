<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Portafolio SO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 2px solid #00d4ff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #00d4ff;
      text-decoration: none;
    }

    nav a {
      color: #a0b4c8;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover { color: #00d4ff; }

    .hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 4rem 2rem;
      text-align: center;
      border-bottom: 1px solid #1e3a5f;
    }

    .hero h1 {
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    .hero h1 span { color: #00d4ff; }

    .hero p {
      color: #a0b4c8;
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(0,212,255,0.1);
      border: 1px solid #00d4ff;
      color: #00d4ff;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      margin: 0.3rem;
    }

    main {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .section-title {
      font-size: 1.5rem;
      color: #00d4ff;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e3a5f;
    }

    .post-card {
      background: #1a1a2e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      transition: border-color 0.2s, transform 0.2s;
    }

    .post-card:hover {
      border-color: #00d4ff;
      transform: translateY(-2px);
    }

    .post-card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .post-card h2 a { color: #ffffff; text-decoration: none; }
    .post-card h2 a:hover { color: #00d4ff; }
    .post-card .meta { color: #607d8b; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .post-card p { color: #a0b4c8; font-size: 0.95rem; line-height: 1.6; }

    .post-content {
      background: #1a1a2e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 2.5rem;
      line-height: 1.8;
    }

    .post-content h1, .post-content h2, .post-content h3 {
      color: #00d4ff;
      margin: 1.5rem 0 0.8rem;
    }

    .post-content p { color: #c0cdd8; margin-bottom: 1rem; }

    .post-content code {
      background: #0f0f1a;
      border: 1px solid #1e3a5f;
      color: #00ff88;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }

    .post-content pre {
      background: #0a0a14;
      border: 1px solid #1e3a5f;
      border-left: 3px solid #00d4ff;
      border-radius: 8px;
      padding: 1.5rem;
      overflow-x: auto;
      margin: 1rem 0;
    }

    .post-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #00ff88;
    }

    .post-content img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      margin: 1rem 0;
    }

    .post-content ul, .post-content ol {
      padding-left: 1.5rem;
      color: #c0cdd8;
      margin-bottom: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #607d8b;
      font-size: 0.85rem;
      border-top: 1px solid #1e3a5f;
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">⚙️ Portafolio SO</a>
    <nav>
      <a href="/">Inicio</a>
      <a href="/about">Acerca de</a>
    </nav>
  </header>

  {{ content }}

  <footer>
    Natalia — Instituto de Computación, UTM · Sistemas Operativos 2026
  </footer>
</body>
</html>
